set-option -g default-terminal "tmux-256color"
# set -a terminal-features "xterm-ghostty:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g window-status-current-style "fg=black bg=white"
set -g status-style "bg=default"
# set -g status-right "#(~/.config/tmux/tmux-status.sh '#{pane_id}') | test"
set -g status-right ""
set -g status-left "#S"

set -g focus-events on
set-hook -g pane-focus-in "refresh-client -S"

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# lets us not need to release ctrl for next and prev window
bind C-p previous-window
bind C-n next-window

bind r source-file "~/.config/tmux/tmux.conf"
bind f run "tmux neww ~/.config/tmux/tmux-session-dispensary.sh"
bind E show-environment -g


unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
